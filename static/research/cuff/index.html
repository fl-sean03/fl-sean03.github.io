<style>
:root{color-scheme:light dark;
  --bg:#fbfcfd; --card:#fff; --ink:#12151a; --mut:#5d6773; --line:#dde3ea;
  --accent:#1a56b8; --bad:#b0341d;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --mut:#8b949e; --line:#30363d;
  --accent:#6ea8fe; --bad:#ff7b72}}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#161b22; --ink:#e6edf3; --mut:#8b949e; --line:#30363d;
  --accent:#6ea8fe; --bad:#ff7b72}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:26rem;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:1.6rem 1.5rem}
h1{margin:0 0 .3rem;font-size:1.06rem;letter-spacing:-.01em}
p.sub{margin:0 0 1.2rem;color:var(--mut);font-size:.83rem;line-height:1.5}
label{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mut);margin-bottom:.4rem}
input{width:100%;padding:.6rem .7rem;font-family:var(--mono);font-size:.92rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{margin-top:.85rem;width:100%;padding:.62rem;font:600 .85rem/1 var(--sans);
  background:var(--accent);color:#fff;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:.8rem;font-size:.8rem;min-height:1.2em}
.msg.err{color:var(--bad)}
.msg.work{color:var(--mut)}
.foot{margin-top:1.2rem;font-size:.7rem;color:var(--mut);line-height:1.5}
</style></head><body>

    for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  function say(t,c){m.textContent=t;m.className="msg"+(c?" "+c:"");}
  if(!(window.crypto&&window.crypto.subtle)){
    say("This browser has no WebCrypto, so the page cannot be decrypted. "+
        "Open it over https in a current browser.","err");
    go.disabled=true;return;
  }
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var p=pw.value; if(!p){say("Enter the password.","err");return;}
    go.disabled=true; say("Decrypting\u2026","work");
    var enc=new TextEncoder();
    crypto.subtle.importKey("raw",enc.encode(p),{name:"PBKDF2"},false,["deriveKey"])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);
    })
    .then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
    })
    .then(function(buf){
      /* payload is gzipped; inflate with the platform stream, no library */
      if(typeof DecompressionStream==="undefined"){
        throw new Error("This browser cannot inflate the payload (no DecompressionStream).");
      }
      var ds=new DecompressionStream("gzip");
      var s=new Blob([buf]).stream().pipeThrough(ds);
      return new Response(s).text();
    })
    .then(function(html){
      document.open(); document.write(html); document.close();
    })
    .catch(function(err){
      go.disabled=false;
      say(/DecompressionStream/.test(String(err&&err.message))
          ? String(err.message)
          : "That password did not decrypt this page.","err");
      pw.select();
    });
  });
})();
</script>
</body></html>
